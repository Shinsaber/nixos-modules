# -- général -------------------------------------------------------------------

# Terminal moderne avec support couleurs vraies
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set  -s  escape-time  10      # séquences de commandes plus rapides
set  -sg repeat-time  600     # augmente le délai de répétition
set  -s  focus-events on
set  -g  allow-passthrough on   # laisse passer les notifications terminal (zsh auto-notify)
set  -g  bell-action any        # transmet la cloche de toutes les fenêtres au terminal client

set -g history-limit 50000    # historique plus important (recommandé)

set -g detach-on-destroy off  # fermer la dernière fenêtre d'une session bascule sur une autre session au lieu de quitter tmux

# Tuer une session/fenêtre/panneau plus facilement
bind x confirm-before -p "kill-pane #P? (y/n)"    kill-pane
bind X confirm-before -p "kill-window #W? (y/n)"  kill-window
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session

# Changer le préfixe de 'Ctrl+B' à 'Ctrl+Espace'
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# -- affichage -----------------------------------------------------------------

set  -g base-index      1     # commencer la numérotation des fenêtres à 1
setw -g pane-base-index 1     # rendre la numérotation des panneaux cohérente avec les fenêtres

set -g renumber-windows on    # renuméroter les fenêtres lorsqu'une fenêtre est fermée

set -g status-interval     10 # rafraîchir la barre d'état toutes les 10 secondes
set -g display-panes-time 800 # durée d'affichage des indicateurs de panneaux légèrement augmentée
set -g display-time      1000 # durée d'affichage des messages d'état légèrement augmentée

# effacer l'écran sans toucher à l'historique
bind -n C-l send-keys C-l

# effacer l'écran ET l'historique (raccourci alternatif)
bind -n C-k send-keys C-l \; run 'sleep 0.2' \; clear-history

# activité
set -g monitor-activity on
set -g visual-activity off


# -- navigation ----------------------------------------------------------------

# créer une session
bind C-c new-session

# créer une session nommée
bind C-s command-prompt -p "Nom de la nouvelle session: " "new-session -d -s '%%'"

# lister toutes les sessions avec aide contextuelle
bind C-l choose-tree -s -O time -f '#{?session_grouped,#{session_group}: ,}#{session_name}#{?session_attached, (attached),}' -K 'x: kill-session, d: detach, Enter: attach'

# interface de gestion complète (sessions + fenêtres + panneaux)
bind C-w choose-tree -Z

# navigation entre les sessions
bind    BTab switch-client -l  # aller à la dernière session
bind -r C-p  switch-client -p  # session précédente
bind -r C-n  switch-client -n  # session suivante

# renommer la session courante
bind '$' command-prompt -I "#S" "rename-session '%%'"

# navigation entre les panneaux
bind > swap-pane -D       # échanger le panneau courant avec le suivant
bind < swap-pane -U       # échanger le panneau courant avec le précédent

# Intégration NeoVim : vrai si la commande au premier plan du panneau est (n)vim.
# Test de format (if -F) : aucun processus lancé à chaque frappe, et utilisable dans les menus.
is_vim='#{m/r:^(n?vim?x?|view)(diff)?(-wrapped)?$,#{pane_current_command}}'

# rechercher dans zsh
bind-key -n C-f send-keys C-r

## Diviser la fenêtre courante horizontalement (garde le répertoire)
bind-key 's' if-shell -F "$is_vim" "send-keys Escape ':split' Enter" 'split-window -v -c "#{pane_current_path}"'
## Diviser la fenêtre courante verticalement (garde le répertoire)
bind-key 'v' if-shell -F "$is_vim" "send-keys Escape ':vsplit' Enter" 'split-window -h -c "#{pane_current_path}"'

## Navigation entre les panneaux
bind-key -n 'C-t' if-shell -F "$is_vim" 'send-keys C-t'  { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind-key -n 'C-s' if-shell -F "$is_vim" 'send-keys C-s'  { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-r' if-shell -F "$is_vim" 'send-keys C-r'  { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind-key -n 'C-n' if-shell -F "$is_vim" 'send-keys C-n'  { if -F '#{pane_at_right}'  '' 'select-pane -R' }

bind-key -T copy-mode-vi 'C-t' if -F '#{pane_at_left}'   '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-s' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-r' if -F '#{pane_at_top}'    '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-n' if -F '#{pane_at_right}'  '' 'select-pane -R'

# maximiser le panneau courant
bind + resize-pane -Z

# redimensionnement des panneaux
bind -r T resize-pane -L 2
bind -r S resize-pane -D 2
bind -r R resize-pane -U 2
bind -r N resize-pane -R 2

# navigation entre les fenêtres
unbind n
unbind p
bind -r C-t previous-window # sélectionner la fenêtre précédente
bind -r C-n next-window     # sélectionner la fenêtre suivante
bind    Tab last-window     # aller à la dernière fenêtre active

# Accès rapide aux fenêtres par numéro
bind -r 1 select-window -t 1
bind -r 2 select-window -t 2
bind -r 3 select-window -t 3
bind -r 4 select-window -t 4
bind -r 5 select-window -t 5
bind -r 6 select-window -t 6
bind -r 7 select-window -t 7
bind -r 8 select-window -t 8
bind -r 9 select-window -t 9

# Créer une nouvelle fenêtre dans le répertoire courant
bind c new-window     -c "#{pane_current_path}"
bind C command-prompt -p "Name of new window:" "new-window -n '%%' -c '#{pane_current_path}'"

# Renommer la fenêtre courante
bind , command-prompt -I "#W" "rename-window '%%'"

# Désactiver le renommage automatique pour une fenêtre spécifique
bind M setw automatic-rename off \; command-prompt -I "#W" "rename-window '%%'"

# activer/désactiver la souris
bind m set -g mouse \; display "Souris : #{?mouse,activée,désactivée}"

# -- souris et ergonomie ------------------------------------------------------

# Support souris moderne
set -g mouse on

# Défilement plus fluide
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# -- mode copie ---------------------------------------------------------------

setw -g mode-keys vi
bind Enter copy-mode # entrer en mode copie

# Raccourcis personnalisés pour le mode copie (style vi)
bind -T copy-mode-vi v      send -X begin-selection           # 'v' : commencer la sélection (mode visuel)
bind -T copy-mode-vi C-v    send -X rectangle-toggle          # 'Ctrl+v' : basculer en sélection rectangulaire
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel      # 'y' : copier la sélection (+ presse-papier système) et quitter le mode copie
bind -T copy-mode-vi Escape send -X cancel                    # 'Échap' : annuler la sélection et quitter le mode copie
bind -T copy-mode-vi T      send -X start-of-line             # 'T' : aller au début de la ligne
bind -T copy-mode-vi N      send -X end-of-line               # 'N' : aller à la fin de la ligne
bind -T copy-mode-vi /      send -X search-forward            # '/' : recherche vers l'avant
bind -T copy-mode-vi ?      send -X search-backward           # '?' : recherche vers l'arrière

# copier vers le presse-papier système
set -s set-clipboard on   # OSC 52 : le terminal reçoit aussi les copies (fonctionne via SSH)

# copy-command : commande utilisée par copy-pipe sans argument ('y', glisser à la souris) et par les menus.
# NB : $XDG_SESSION_TYPE est lu au démarrage du serveur tmux. Un serveur lancé hors session
# graphique (SSH, TTY) ne détecte ni Wayland ni X11 et ne copie alors que via OSC 52.
if -b '[ "$XDG_SESSION_TYPE" = "wayland" ] && command -v wl-copy > /dev/null 2>&1' \
  'set -s copy-command "wl-copy"'

if -b '[ "$XDG_SESSION_TYPE" = "x11" ] && command -v xclip > /dev/null 2>&1' \
  'set -s copy-command "xclip -selection clipboard"'

# copier le dernier tampon vers le presse-papier système
bind y if -F '#{copy-command}' { run -b 'tmux save-buffer - | #{copy-command}' }

# -- tampons ------------------------------------------------------------------

#bind b list-buffers     # lister les tampons de collage
#bind p paste-buffer -p  # coller depuis le tampon de tête
#bind P choose-buffer    # choisir le tampon à coller

# -- aide ----------------------------------------------------------------------

# Afficher l'aide pour la gestion des sessions
tmux_help='echo -n "
┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┯━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
┃ Session                            │ Fenetre                            ┃
┃   Leader + C-c : Nouvelle          │   Leader + c : Nouvelle            ┃
┃   Leader + C-s : Nouvelle nommée   │   Leader + C : Nouvelle Nommée     ┃
┃   Leader + \$   : Renommer courante │   Leader + , : Renommer courante   ┃
┃   Leader + Q   : Tuer courante     │   Leader + X : Tuer courante       ┃
┠────────────────────────────────────┼────────────────────────────────────┨
┃ Panneau                            │ Autre                              ┃
┃   C-t : To left                    │   C-l : Clear Panneau              ┃
┃   C-s : To Botom                   │   C-k : clear + delete historique  ┃
┃   C-r : To Top                     │   C-f : Recherche zsh              ┃
┃   C-n : To Right                   ├────────────────────────────────────┨
┃   Leader + < : Échanger suivant    │ Dans Choose-Tree (Leader + w)      ┃
┃   Leader + > : Échanger précédent  │   Enter      : Attacher la session ┃
┃   Leader + + : Maximiser           │   x          : Tuer la session     ┃
┃                                    │   q / Escape : Quitter sans action ┃
┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┷━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛"; read'

bind h display-popup -E -w 77 -h 21 "$tmux_help"

# -- menu contextuel souris avancé --------------------------------------------

# Menu contextuel au clic droit (MouseDown3Pane) avec options intelligentes :
# - Détecte automatiquement le contexte (mode copie, mot/ligne/lien sous la souris, vim)
# - Propose des actions contextuelles adaptées selon la situation
# - Inclut la gestion des panneaux, division, échange et zoom
# - Options spéciales vim quand nvim/vim est détecté
# - Menus à deux niveaux pour une meilleure organisation
# 
# Actions disponibles dans le menu :
# - Navigation : Go To Top/Bottom (si en mode copie)
# - Recherche : Search For [mot] (Ctrl+r)
# - Texte : Type/Copy mot sous la souris (Ctrl+y/c)
# - Ligne : Copy Line (l)
# - Liens : Type/Copy hyperlink (Ctrl+h/h)
# - Vim (si détecté) : Save/Quit/Split Horizontal/Split Vertical
# - Division : Horizontal/Vertical Split (h/v)
# - Échange : Swap Up/Down/Marked (u/d/s)
# - Gestion : Kill/Respawn/Mark/Zoom (X/R/m/z)

# -- Menus modulaires avec plugin shell ---------------------------------------

# Menu principal accessible via Ctrl+E
bind-key -n 'C-e' run-shell '$tmux_menu show_main'

# Menu principal également accessible via double-clic gauche sur la barre de statut
bind-key -T root DoubleClick1Status run-shell '$tmux_menu show_main'

# Menu principal accessible via clic du milieu sur un panneau
bind-key -T root MouseDown2Pane run-shell '$tmux_menu show_main'

# Raccourcis directs vers les sous-menus
bind-key -n 'M-s' run-shell '$tmux_menu show_sessions'
bind-key -n 'M-w' run-shell '$tmux_menu show_windows'
bind-key -n 'M-p' run-shell '$tmux_menu show_panes'
bind-key -n 'M-t' run-shell '$tmux_menu show_tools'

# Les entrées « Vim » n'apparaissent que si (n)vim est au premier plan ($is_vim).
# Dans les conditions #{?…}, pas de virgule dans les #[…] (sinon elles coupent la condition).
bind-key -T root MouseDown3Pane if-shell -F -t = "#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}" { select-pane -t = } \
{ \
  display-menu -T "#[align=centre,bg=#{@thm_surface_0},fg=#{@thm_lavender}] 󰹯 #{pane_index} (#{pane_current_command}) " -t = -x M -y M \
    "#{?#{m/r:(copy|view)-mode,#{pane_mode}},#[fg=#{@thm_blue}]⬆️ Go To Top,}" < { send-keys -X history-top } \
    "#{?#{m/r:(copy|view)-mode,#{pane_mode}},#[fg=#{@thm_blue}]⬇️ Go To Bottom,}" > { send-keys -X history-bottom } \
    "#{?#{m/r:(copy|view)-mode,#{pane_mode}},-#[align=centre fg=#{@thm_lavender}]──────────,}" "" "" \
    "#{?mouse_word,#[fg=#{@thm_peach}]🔍 Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward "#{q:mouse_word}" } \
    "#{?mouse_word,#[fg=#{@thm_yellow}]📝 Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } \
    "#{?mouse_word,#[fg=#{@thm_green}]📝 Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer -w "#{q:mouse_word}" ; if -F '#{copy-command}' { run -b 'tmux save-buffer - | #{copy-command}' } } \
    "#{?mouse_word,#[fg=#{@thm_sapphire}]📝 Copy Line,}" l { copy-mode -q ; set-buffer -w "#{q:mouse_line}" ; if -F '#{copy-command}' { run -b 'tmux save-buffer - | #{copy-command}' } } \
    "#{?mouse_word,-#[align=centre fg=#{@thm_lavender}]──────────,}" "" "" \
    "#{?mouse_hyperlink,#[fg=#{@thm_pink}]📝 Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } \
    "#{?mouse_hyperlink,#[fg=#{@thm_pink}]📝 Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer -w "#{q:mouse_hyperlink}" ; if -F '#{copy-command}' { run -b 'tmux save-buffer - | #{copy-command}' } } \
    "#{?mouse_hyperlink,-#[align=centre fg=#{@thm_lavender}]──────────,}" "" "" \
    "#{?$is_vim,#[fg=#{@thm_green}]💾 Vim: Save,}" w { send-keys Escape ':w' Enter } \
    "#{?$is_vim,#[fg=#{@thm_blue}]💾 Vim: Save & Quit,}" q { send-keys Escape ':wq' Enter } \
    "#{?$is_vim,#[fg=#{@thm_red}]🚪 Vim: Quit,}" Q { send-keys Escape ':q!' Enter } \
    "#{?$is_vim,#[fg=#{@thm_mauve}]󰤻 Vim: Split Horizontal,}" H { send-keys Escape ':split' Enter } \
    "#{?$is_vim,#[fg=#{@thm_mauve}]󰤼 Vim: Split Vertical,}" V { send-keys Escape ':vsplit' Enter } \
    "#{?$is_vim,#[fg=#{@thm_yellow}]➕ Vim: New Tab,}" t { send-keys Escape ':tabnew' Enter } \
    "#{?$is_vim,-#[align=centre fg=#{@thm_lavender}]──────────,}" "" "" \
    "#[fg=#{@thm_teal}]󰤻 Tmux Split Horizontal" h { split-window -v } \
    "#[fg=#{@thm_teal}]󰤼 Tmux Split Vertical" v { split-window -h } \
    "#{?#{>:#{window_panes},1},#[fg=#{@thm_sky}]🔲 Layout Tiled,}" = { select-layout tiled } \
    "#{?#{>:#{window_panes},1},#[fg=#{@thm_sky}]󰤼 Layout Even Horizontal,}" | { select-layout even-horizontal } \
    "#{?#{>:#{window_panes},1},#[fg=#{@thm_sky}]󰤻 Layout Even Vertical,}" - { select-layout even-vertical } \
    "-#[align=centre,fg=#{@thm_lavender}]──────────" "" "" \
    "#{?#{>:#{window_panes},1},#[fg=#{@thm_sapphire}]🔄 Swap Up,}" u { swap-pane -U } \
    "#{?#{>:#{window_panes},1},#[fg=#{@thm_sapphire}]🔄 Swap Down,}" d { swap-pane -D } \
    "#{?pane_marked_set,#[fg=#{@thm_peach}]📌 Swap Marked,}" s { swap-pane } \
    "#{?#{>:#{window_panes},1},-#[align=centre fg=#{@thm_lavender}]──────────,}" "" "" \
    "#[fg=#{@thm_red}]❌ Kill" X { kill-pane } \
    "#[fg=#{@thm_yellow}]🔄 Respawn" R { respawn-pane -k } \
    "#{?pane_marked,#[fg=#{@thm_maroon}]📌 Unmark,#[fg=#{@thm_peach}]📌 Mark}" m { select-pane -m } \
    "#{?#{>:#{window_panes},1},#{?window_zoomed_flag,#[fg=#{@thm_blue}]🔍 Unzoom,#[fg=#{@thm_blue}]🔍 Zoom},}" z { resize-pane -Z } \
}


bind-key -T root MouseDown3Status \
  display-menu -T "#[align=centre,bg=#{@thm_surface_0},fg=#{@thm_lavender}] 󰹯 #{window_index}:#{window_name} " -t = -x W -y W \
    "#{?#{>:#{session_windows},1},#[fg=#{@thm_sapphire}]🔄 Swap Left,}"  l { swap-window -t :-1 } \
    "#{?#{>:#{session_windows},1},#[fg=#{@thm_sapphire}]🔄 Swap Right,}" r { swap-window -t :+1 } \
    "#{?pane_marked_set,#[fg=#{@thm_peach}]📌 Swap Marked,}"             s { swap-window } \
    "#{?#{>:#{session_windows},1},-#[align=centre fg=#{@thm_lavender}]──────────,}" "" "" \
    "#[fg=#{@thm_red}]❌ Kill" X { kill-window } \
    "#[fg=#{@thm_yellow}]🔄 Respawn" R { respawn-window -k } \
    "#{?pane_marked,#[fg=#{@thm_maroon}]📌 Unmark,#[fg=#{@thm_peach}]📌 Mark}" m { select-pane -m } \
    "#[fg=#{@thm_green}]📝 Rename" n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
    "-#[align=centre fg=#{@thm_lavender}]──────────" "" "" \
    "#[fg=#{@thm_pink}]➕ New After"  w { new-window -a } \
    "#[fg=#{@thm_pink}]➕ New At End" W { new-window }


bind-key -T root \
  MouseDown3StatusLeft   \
    display-menu -T "#[align=centre,bg=#{@thm_surface_0},fg=#{@thm_lavender}] 󰹯 #{session_name} " -t = -x M -y W \
      "#[fg=#{@thm_blue}]⏭️ Next"        n { switch-client -n } \
      "#[fg=#{@thm_blue}]⏮️ Previous"    p { switch-client -p } \
      "-#[align=centre fg=#{@thm_lavender}]──────────" "" "" \
      "#[fg=#{@thm_yellow}]🔢 Renumber"  N { move-window -r } \
      "#[fg=#{@thm_green}]📝 Rename"     n { command-prompt -I "#S" { rename-session "%%" } } \
      "-#[align=centre fg=#{@thm_lavender}]──────────" "" "" \
      "#[fg=#{@thm_pink}]➕ New Session" s { new-session } \
      "#[fg=#{@thm_pink}]➕ New Window"  w { new-window }


bind-key -T root \
  MouseDown3StatusRight \
    display-menu -T "#[align=centre,bg=#{@thm_surface_0},fg=#{@thm_lavender}]  Kubernetes " -t = -x M -y W \
      "#[align=centre fg=#{@thm_lavender}]─────Kube─────" "" "" \
      "#[fg=#{@thm_blue}]🔄 Switch Context" c { run-shell 'tmux display-popup -E -w 80% -h 80% "kubectl config get-contexts -o name | fzf --reverse --header=\"Select Kubernetes Context\" | xargs -r kubectl config use-context"' } \
      "#[fg=#{@thm_green}]📦 Switch Namespace" n { run-shell 'tmux display-popup -E -w 80% -h 80% "kubectl get namespaces -o jsonpath=\"{.items[*].metadata.name}\" | tr \" \" \"\\n\" | fzf --reverse --header=\"Select Namespace\" | xargs -r kubectl config set-context --current --namespace"' }
